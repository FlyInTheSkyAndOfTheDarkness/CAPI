services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: capi
      POSTGRES_PASSWORD: capi
      POSTGRES_DB: capi
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  pgdata:
